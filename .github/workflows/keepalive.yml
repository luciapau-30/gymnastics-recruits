    - cron: "0 */4 * * *"   # every 4 hours (you can change this)
  workflow_dispatch:       # manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Curl ping Streamlit
        run: curl -s https://gymnastics-recruits-ohrtqszxjbcf5voognscce.streamlit.app > /dev/null
